name: CI Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: yarn-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="✅ *Build thành công*%0A*Repo:* dev-freelancer-such/animae%0A*Branch:* ${{ github.head_ref }}%0A*PR:* ${{ github.event.pull_request.title }}%0A*Người tạo:* ${{ github.actor }}"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *Build thất bại*%0A*Repo:* dev-freelancer-such/animae%0A*Branch:* ${{ github.head_ref }}%0A*PR:* ${{ github.event.pull_request.title }}%0A*Người tạo:* ${{ github.actor }}"

